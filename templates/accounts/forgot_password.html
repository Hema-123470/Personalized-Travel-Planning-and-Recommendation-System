{% extends 'base.html' %}
{% block title %}Forgot Password – AI Travel Planner{% endblock %}
{% block extra_css %}<style>body{background:linear-gradient(135deg,#667eea,#764ba2)!important}main{min-height:calc(100vh - 120px);display:flex;align-items:center}</style>{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="auth-card shadow-lg">
        <div class="text-center mb-4">
          <div class="auth-logo"><i class="fas fa-key"></i></div>
          <h3 class="fw-bold">Forgot Password?</h3>
          <p class="text-muted">Enter your email and we'll send you a temporary password.</p>
        </div>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill">
            <i class="fas fa-paper-plane me-2"></i>Send Temporary Password
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'login' %}" class="text-primary text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
